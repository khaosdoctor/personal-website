    :root { --bg: #f4efe0; --text: #4f493f; --border: #736e62; --accent: #0571b3;
            --red: #d50612; --green: #39936c; --yellow: #ac7d00; --blue: #0571b3; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #131313; --text: #d6d2c9; --border: #6b627b; --accent: #1480c2;
                                        --red: #e6242f; --green: #45b384; --yellow: #f5b200; --blue: #1480c2; }
    }
    :root[data-theme="dark"] { --bg: #131313; --text: #d6d2c9; --border: #6b627b; --accent: #1480c2;
                               --red: #e6242f; --green: #45b384; --yellow: #f5b200; --blue: #1480c2; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: grid; place-items: center; text-align: center; overflow: hidden;
           background: var(--bg); color: var(--text); font: 16px "Departure Mono", ui-monospace, monospace; }
    header { position: absolute; top: 24px; left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; }
    .brand svg { width: 32px; height: 32px; shape-rendering: crispEdges; }
    p { margin: 0; }
    .cursor::after { content: "█"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    /* The spinner sits dead centre; the tip hangs off its bottom edge */
    main { position: relative; --gap: 150px; --spin: min(30vw, 30vh); }
    #tip { position: absolute; left: 50%; translate: -50% 0; top: calc(100% + var(--gap)); width: max-content; max-width: calc(100vw - 32px); }
    @media (max-height: 820px) { main { --gap: 10vh; } }
    @media (max-width: 600px) {
      main { --gap: min(10vh, 80px); --spin: min(55vw, 28vh); }
      .brand { font-size: 20px; }
      .intro { font-size: 14px; }
      #tip { font-size: 18px; }
    }
    /* 3x3 ring of big pixels; the lit one walks clockwise: 1 2 3 6 9 8 7 4 */
    .pixels { width: var(--spin); aspect-ratio: 1; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 6%; }
    .pixels i { background: var(--border); opacity: .2; animation: lit 1.6s steps(1) infinite; }
    .pixels i:nth-child(5) { visibility: hidden; }
    .pixels i:nth-child(1) { --on: var(--red); }
    .pixels i:nth-child(2) { --on: var(--green); animation-delay: .2s }
    .pixels i:nth-child(3) { --on: var(--yellow); animation-delay: .4s }
    .pixels i:nth-child(6) { --on: var(--blue); animation-delay: .6s }
    .pixels i:nth-child(9) { --on: var(--red); animation-delay: .8s }
    .pixels i:nth-child(8) { --on: var(--green); animation-delay: 1s }
    .pixels i:nth-child(7) { --on: var(--yellow); animation-delay: 1.2s }
    .pixels i:nth-child(4) { --on: var(--blue); animation-delay: 1.4s }
    @keyframes lit { 0% { background: var(--on); opacity: 1 } 12.5% { background: var(--border); opacity: .2 } }
    #tip { color: var(--accent); font-size: 20px; display: inline-block; }
    #tip.glitch { animation: glitch .3s steps(1); }
    @keyframes glitch {
      0%   { transform: translate(-3px, 1px); text-shadow: 3px 0 var(--red), -3px 0 var(--blue); clip-path: inset(10% 0 45% 0); }
      25%  { transform: translate(3px, -1px); text-shadow: -3px 0 var(--green), 3px 0 var(--yellow); clip-path: inset(50% 0 5% 0); }
      50%  { transform: translate(-2px, 0); text-shadow: 2px 0 var(--blue), -2px 0 var(--red); clip-path: none; }
      75%  { transform: none; text-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) { .pixels i, .cursor::after, #tip.glitch { animation: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <rect x="0" y="0" width="2" height="4" fill="var(--red)"/><rect x="0" y="4" width="5" height="2" fill="var(--red)"/>
        <rect x="3" y="0" width="5" height="3" fill="var(--green)"/><rect x="6" y="4" width="2" height="2" fill="var(--yellow)"/>
        <rect x="1" y="7" width="7" height="1" fill="var(--blue)"/>
      </svg>
      <span>Lucas Santos</span>
    </div>
    <div class="intro">
      <p>It seems like you hit my redirect page</p>
      <p class="cursor" role="status">taking you there </p>
    </div>
  </header>
  <main>
    <div class="pixels" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <a id="tip" href="https://lsantos.dev">check my website</a>
  </main>
  <script>
    const tips = [
      ["check my website", "https://lsantos.dev"],
      ["check my blog", "https://blog.lsantos.dev"],
      ["I do open source", "https://oss.lsantos.dev"],
      ["watch my videos", "https://youtube.lsantos.dev"],
      ["slides from my talks", "https://talks.lsantos.dev"],
      ["what I'm up to now", "https://lsantos.dev/now"],
      ["talk to me", "https://schedule.lsantos.dev"],
    ];
    const tip = document.getElementById("tip");
    let index = 1;
    setInterval(() => {
      [tip.textContent, tip.href] = tips[index++ % tips.length];
      tip.classList.remove("glitch");
      void tip.offsetWidth; // restart the animation
      tip.classList.add("glitch");
    }, 2000);
  </script>
</body>
