<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uses - Lucas Santos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Ctext x='4' y='22' font-family='monospace' font-size='18' fill='%23d6d2c9'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4efe0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/components.js"></script>
</head>
<body>
  <div class="layout">
    <site-sidebar class="sidebar"></site-sidebar>

    <main class="content">
      <div class="content-inner">
        <div class="section-label">// USES</div>
        <p class="page-desc">Gear, tools, and equipment I use and have opinions about.</p>
        <div id="gear-container">
          <p class="muted">loading...</p>
        </div>

        <site-footer class="socials"></site-footer>
      </div>
    </main>
  </div>

  <script>
    const CATEGORY_LABELS = {
      music: 'Music',
      electronics: 'Electronics',
      tech: 'Tech',
      other: 'Other',
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('gear-container');
      try {
        const res = await fetch('/data/gear/gear.json');
        if (!res.ok) throw 0;
        const items = await res.json();

        const grouped = {};
        for (const item of items) {
          const cat = item.category || 'other';
          (grouped[cat] ||= []).push(item);
        }

        const order = ['music', 'electronics', 'tech', 'other'];
        let html = '';
        for (const cat of order) {
          const group = grouped[cat];
          if (!group) continue;
          group.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          html += `<div class="gear-category">
            <h2>${CATEGORY_LABELS[cat] || cat}</h2>
            <ul class="gear-list">
              ${group.map(g => {
                const d = document.createElement('div');
                d.textContent = g.oneliner;
                const safe = d.innerHTML;
                const inner = `<span class="gear-name">${g.name}</span>
                  <span class="gear-desc">${safe}</span>
                  <span class="gear-rating">${g.rating}/10</span>`;
                if (g.externalLink) {
                  return `<li><a href="${g.externalLink}" target="_blank" rel="noopener" class="gear-link">${inner}</a></li>`;
                } else if (g.hasPage) {
                  return `<li><a href="/gear/${g.slug}.html" class="gear-link">${inner}</a></li>`;
                }
                return `<li>${inner}</li>`;
              }).join('')}
            </ul>
          </div>`;
        }
        container.innerHTML = html;

        const tip = document.createElement('div');
        tip.className = 'gear-tip';
        document.body.appendChild(tip);

        for (const el of container.querySelectorAll('.gear-desc')) {
          if (el.scrollWidth > el.clientWidth) {
            el.classList.add('truncated');
            el.addEventListener('mouseenter', () => {
              const r = el.getBoundingClientRect();
              tip.textContent = el.textContent;
              tip.style.left = r.left + 'px';
              tip.style.top = (r.bottom + 4) + 'px';
              tip.classList.add('visible');
            });
            el.addEventListener('mouseleave', () => {
              tip.classList.remove('visible');
            });
          }
        }
      } catch {
        container.innerHTML = '<p class="muted">no gear yet - run sync.js</p>';
      }
    });
  </script>
</body>
</html>
