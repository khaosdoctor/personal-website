name: build

# Vault notes arrive in data/vault from the second-brain repo, which pushes only the notes
# meant to be public. Nothing here ever reads the vault.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'sync.js'
      - 'sync/**'
      - 'package.json'
      - 'bun.lock'
      # Root pages only; the bot's own commits to gear/ and builds/ are [skip ci]
      - '*.html'
  # Daily refresh for the blog posts, which change outside this repo
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      # Full history for the now page date, blobless so old images aren't downloaded
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Pinned so a new Bun release can't break the daily bake; bump it on purpose
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Bake the pages
        run: bun sync.js --debug --prune-images

      - name: Commit the generated pages
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Everything the bake writes: note pages, their images, the baked root pages, feeds and sitemap
          git add -A gear builds img/gear *.html *.xml
          git diff --cached --quiet && echo 'nothing to commit' && exit 0
          git commit -m 'chore: bake content [skip ci]'
          git push
