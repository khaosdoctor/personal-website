<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now - Lucas Santos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Ctext x='4' y='22' font-family='monospace' font-size='18' fill='%23d6d2c9'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4efe0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/components.js"></script>
</head>
<body>
  <div class="layout">
    <site-sidebar class="sidebar"></site-sidebar>

    <main class="content">
      <div class="content-inner">
        <div class="section-label">// NOW</div>
        <p class="page-desc">
          What I'm doing now. Inspired by <a href="https://nownownow.com" target="_blank" rel="noopener">nownownow.com</a>.
        </p>
        <p class="now-date">Last updated: <span id="now-date">September 2026</span></p>

        <div id="now-content">
          <p class="muted">loading...</p>
        </div>

        <site-footer class="socials"></site-footer>
      </div>
    </main>
  </div>

  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15/lib/marked.esm.js';
    const el = document.getElementById('now-content');
    try {
      const res = await fetch('/data/now.md');
      if (!res.ok) throw 0;
      const md = await res.text();
      el.innerHTML = marked(md);
      const lastMod = new Date(res.headers.get('last-modified') || Date.now());
      const d = lastMod.getDate().toString().padStart(2, '0');
      const m = (lastMod.getMonth() + 1).toString().padStart(2, '0');
      document.getElementById('now-date').textContent = `${lastMod.getFullYear()}-${m}-${d}`;
    } catch {
      el.innerHTML = '<p class="muted">nothing here yet</p>';
    }
  </script>
</body>
</html>
